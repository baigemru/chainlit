[project]
name = "chainlit"
dynamic = ["version"]
keywords = [
    "LLM",
    "Agents",
    "MCP",
    "gen ai",
    "chat ui",
    "chatbot ui",
    "openai",
    "copilot",
    "langchain",
    "conversational ai",
]
description = "Build Conversational AI."
authors = [
    { name = "Willy Douhard" },
    { name = "Dan Andre Constantini" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.13,<3.15"
classifiers = [
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
    "Programming Language :: JavaScript",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Web Environment",
]

dependencies = [
    "httpx>=0.28.1",
    "literalai==0.1.201",
    "dataclasses_json>=0.6.7,<0.7.0",
    # 0.137.2 for fastapi.routing.iter_route_contexts, which cl.server_route
    # needs to find the SPA catch-all inside an included router.
    "fastapi>=0.141.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
    "python-socketio>=5.16.4,<6.0.0",
    "aiofiles>=25.1.0",
    "syncer>=2.0.3,<3.0.0",
    "asyncer>=0.0.18,<0.1.0",
    "mcp>=1.29.1,<2.0.0",
    "click>=8.4.2,<9.0.0",
    "tomli>=2.4.1,<3.0.0",
    # Forked by python version: pydantic-core gets cp314 wheels only from
    # the 2.12 line, while semantic-kernel (tests extra, <3.14 only) pins
    # pydantic below 2.12 — so the resolver must be free to pick per-split.
    "pydantic>=2.11.10,<3; python_version<'3.14'",
    "pydantic>=2.13.4,<3; python_version>='3.14'",
    "python-dotenv>=1.2.3,<2.0.0",
    "watchfiles>=1.2.0,<2.0.0",
    "filetype>=1.2.0,<2.0.0",
    "lazify>=0.4.0,<0.5.0",
    "packaging>=26.3",
    "python-multipart>=0.0.32,<1.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "pydantic-settings>=2.15.0"
]

[dependency-groups]
dev = [
    "hatchling",
    "ruff>=0.16.4,<1.0.0",
]

[project.urls]
Homepage = "https://chainlit.io/"
Documentation = "https://docs.chainlit.io/"
Repository = "https://github.com/Chainlit/chainlit"

[project.scripts]
chainlit = "chainlit.cli:cli"

[project.optional-dependencies]
tests = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=6.3.0,<7.0.0",
    "openai>=2.54.0,<3.0.0",
    "langchain>=1.3.17",
    "llama-index>=0.14.24,<1.0.0",
    # No 3.14-capable release yet: every current version pins pydantic
    # below the first release with cp314 wheels (and newer ones require a
    # pre-release azure-ai-agents).
    "semantic-kernel>=1.36.0,<2.0.0; python_version<'3.14'",
    "tenacity>=9.1.4,<10.0.0",
    "transformers>=5.15.1,<6.0",
    "matplotlib>=3.11.1,<4.0.0",
    "plotly>=6.9.0,<7.0.0",
    "slack_bolt>=1.30.0,<2.0.0",
    "discord>=2.3.2,<3.0.0",
    "botbuilder-core>=4.17.1,<5.0.0",
    "aiosqlite>=0.22.1,<1.0.0",
    "pandas>=3.0.5,<4.0.0",
    "polars>=1.44.0,<2.0.0",
    "moto>=5.2.3,<6.0.0",
]
mypy = [
    "mypy>=1.20.2,<2.0.0",
    "types-requests>=2.33.0.20260712,<3.0.0",
    "types-aiofiles>=25.1.0.20260518,<26.0.0",
    "mypy-boto3-dynamodb>=1.43.64,<2.0.0",
    "pandas-stubs>=3.0.5.260730,<4.0.0; python_version>='3.9'",
]
custom-data = [
    "asyncpg>=0.31.0,<1.0.0",
    "SQLAlchemy>=2.0.52,<3.0.0",
    "boto3>=1.43.79,<2.0.0",
    "azure-identity>=1.25.3,<2.0.0",
    "azure-storage-file-datalake>=12.25.0,<13.0.0",
    "azure-storage-blob>=12.30.0,<13.0.0",
    "google-cloud-storage>=3.13.1,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "chainlit/frontend/**/*",
  "chainlit/copilot/**/**/"
]

[tool.hatch.build.hooks.custom]
path = "build.py"

[tool.hatch.build.targets.sdist]
artifacts = [
    "chainlit/frontend/dist/**/*",
    "chainlit/copilot/dist/**/*"
]

[tool.hatch.build.targets.wheel]
packages = ["chainlit"]
artifacts = [
    "chainlit/frontend/dist/**/*",
    "chainlit/copilot/dist/**/*"
]

[tool.hatch.version]
path = "chainlit/version.py"
