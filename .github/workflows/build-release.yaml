name: Build and Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

# Creating a release with a new tag in the GitHub UI fires both `push` (tag)
# and `release: published` — serialize them so the second run just re-uploads.
concurrency:
  group: build-release-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build chainlit wheel and publish to GitHub Release
    runs-on: ubuntu-latest
    # The Litestar line ships as `chainlit-litestar` from tags `litestar-v*`
    # (build-litestar.yaml). Its pre-releases also fire `release: published`
    # here, and this job must not touch them: the two lines share nothing.
    if: ${{ !startsWith(github.ref_name, 'litestar-') && !startsWith(github.event.release.tag_name, 'litestar-') }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="$RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=""
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG:-<none>}"

      - name: Install pnpm
        uses: pnpm/action-setup@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install JS dependencies
        run: pnpm install

      - name: Build frontend and copilot
        run: pnpm build

      - name: Copy frontend assets to backend
        run: |
          mkdir -p backend/chainlit/frontend/dist
          cp -r frontend/dist/* backend/chainlit/frontend/dist/

      - name: Copy copilot assets to backend
        run: |
          mkdir -p backend/chainlit/copilot/dist
          cp -r libs/copilot/dist/* backend/chainlit/copilot/dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - name: Set package version from tag
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          echo "__version__ = \"${VERSION}\"" > chainlit/version.py
          echo "Package version set to ${VERSION}"
        working-directory: ./backend

      - name: Install Python dependencies
        run: uv sync --group dev
        working-directory: ./backend

      - name: Build Python distribution
        run: uv build --no-build-isolation
        working-directory: ./backend

      - name: Get version and wheel filename
        id: meta
        run: |
          VERSION=$(uv run python -c "from chainlit.version import __version__; print(__version__)")
          WHEEL=$(find ../dist/ -maxdepth 1 -name '*.whl' | head -1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "wheel=${WHEEL}" >> "$GITHUB_OUTPUT"
        working-directory: ./backend

      - name: Publish assets to GitHub Release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          INSTALL_NOTES="## Install

          \`\`\`bash
          pip install https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename '${{ steps.meta.outputs.wheel }}')
          \`\`\`

          Or install directly from git:

          \`\`\`bash
          pip install git+https://github.com/${{ github.repository }}.git@$TAG
          \`\`\`"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets"
            gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
            BODY=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body)
            if [[ "$BODY" != *"## Install"* ]]; then
              echo "Appending install instructions to release notes"
              gh release edit "$TAG" --repo "${{ github.repository }}" \
                --notes "${BODY}

          ${INSTALL_NOTES}"
            fi
          else
            echo "Creating release $TAG"
            gh release create "$TAG" dist/* \
              --title "chainlit v${{ steps.meta.outputs.version }}" \
              --notes "Automated build from tag $TAG (commit ${{ github.sha }}).

          ${INSTALL_NOTES}"
          fi

      - name: Upload build artifact (no release tag)
        if: steps.tag.outputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: chainlit-dist
          path: dist/*
