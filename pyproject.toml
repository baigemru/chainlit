[dependency-groups]
dev = ["actionlint-py>=1.7.12.24"]
backend = ["chainlit-litestar"]

[tool.mypy]
python_version = "3.14"

[[tool.mypy.overrides]]
module = [
    "filetype",
    "lazify",
    "plotly",
    "socketio.*",
    "syncer",
    "azure.storage.filedatalake",
    "google-cloud-storage",
    "azure.storage.blob",
    "azure.storage.blob.aio",
    "google.auth",
    "google.oauth2",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = [
    # The rebuild is written in the API shape 3.0 keeps, so a deprecated
    # Litestar construct is a defect where it is written rather than a chore
    # for the version bump. Nothing else is escalated: the tree still carries
    # the stack being replaced, and its warnings are not news.
    "error::litestar.exceptions.base_exceptions.LitestarDeprecationWarning",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "LOG",
    "UP",
    "T10",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PIE",
    "PT",
    "Q",
    "RSE",
    "FURB",
    "RUF",
]
ignore = [
    "E712",
    "E501",
    "UP006",
    "UP007",
    "UP035",
    "UP045",
    "PIE790",
    "RUF005",
    "RUF006",
    "RUF012",
    "ISC001",
    # Unquoting annotations breaks runtime introspection: names imported only
    # under TYPE_CHECKING resolve fine for mypy but raise NameError when
    # something evaluates the annotation (Mock(spec=...), inspect.signature).
    "UP037",
    # Restyling public types buys nothing and changes what consumers see:
    # UP042 would turn Theme into a StrEnum, changing str(Theme.light) from
    # "Theme.light" to "light"; UP046/UP047 would move public generics to PEP
    # 695 parameter lists.
    "UP042",
    "UP046",
    "UP047",
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["chainlit"]

[tool.uv]
default-groups = ["backend"]
package = false

[tool.uv.sources]
chainlit-litestar = { workspace = true }

[tool.uv.workspace]
members = ["backend"]
