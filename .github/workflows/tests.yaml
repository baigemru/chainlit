name: Unit & integration tests

on: [workflow_call]

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
    name: python ${{ matrix.python-version }}
    env:
      BACKEND_DIR: ./backend
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/pnpm-node-install
        name: Install Node, pnpm and dependencies.
      - uses: ./.github/actions/uv-python-install
        name: Install Python, uv and Python dependencies
        with:
          python-version: ${{ matrix.python-version }}
          uv-args: --extra tests --extra custom-data
      - name: Run backend tests
        # The step runs from the repo root, where the package source lives
        # at backend/chainlit — the old --cov=chainlit/ pointed at a
        # nonexistent path, so coverage silently measured nothing
        # ("CoverageWarning: No data was collected").
        run: uv run --no-project pytest --cov=backend/chainlit
      - name: Run frontend tests
        run: pnpm run test
