[project]
name = "chainlit-litestar"
dynamic = ["version"]
keywords = [
    "LLM",
    "Agents",
    "gen ai",
    "chat ui",
    "chatbot ui",
    "copilot",
    "conversational ai",
]
description = "Build Conversational AI."
authors = [
    { name = "Willy Douhard" },
    { name = "Dan Andre Constantini" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Framework :: Litestar",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
    "Programming Language :: JavaScript",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Web Environment",
]

dependencies = [
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.52.4",
    "click>=8.4.2,<9.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "watchfiles>=1.2.0,<2.0.0",
    "filetype>=1.2.0,<2.0.0",
    "packaging>=26.3",
    "pyjwt>=2.13.0,<3.0.0",
    "litestar>=2.24.0",
    "msgspec>=0.19",
    "advanced-alchemy>=1.11",
    # Imported directly by the migrations and their env; declared rather than
    # inherited from advanced-alchemy so a bump there cannot take it away.
    "alembic>=1.19",
]

[dependency-groups]
dev = [
    "hatchling",
    "ruff>=0.16.4,<1.0.0",
]

[project.urls]
Homepage = "https://chainlit.io/"
Documentation = "https://docs.chainlit.io/"
Repository = "https://github.com/Chainlit/chainlit"

[project.scripts]
chainlit = "chainlit.cli:cli"
# Alias under the new distribution name; `chainlit` stays the supported entry
# point (the Cypress harness and every existing deployment invoke it).
chainlit-litestar = "chainlit.cli:cli"

[project.optional-dependencies]
tests = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=6.3.0,<7.0.0",
    "matplotlib>=3.11.1,<4.0.0",
    "plotly>=6.9.0,<7.0.0",
    "aiosqlite>=0.22.1,<1.0.0",
    "pandas>=3.0.5,<4.0.0",
    "polars>=1.44.0,<2.0.0",
    "moto>=5.2.3,<6.0.0",
    # Not imported by the package — the Cypress `ask_file` app uses it, and the
    # e2e workflow installs this extra and nothing else.
    "aiofiles>=25.1.0",
]
mypy = [
    "mypy>=1.20.2,<2.0.0",
    "pandas-stubs>=3.0.5.260730,<4.0.0",
]
custom-data = [
    "asyncpg>=0.31.0,<1.0.0",
    "SQLAlchemy>=2.0.52,<3.0.0",
    "boto3>=1.43.79,<2.0.0",
    "google-cloud-storage>=3.13.1,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "chainlit/frontend/**/*",
  "chainlit/copilot/**/**/"
]

[tool.hatch.build.hooks.custom]
path = "build.py"

[tool.hatch.build.targets.sdist]
artifacts = [
    "chainlit/frontend/dist/**/*",
    "chainlit/copilot/dist/**/*"
]

[tool.hatch.build.targets.wheel]
packages = ["chainlit"]
artifacts = [
    "chainlit/frontend/dist/**/*",
    "chainlit/copilot/dist/**/*"
]

[tool.hatch.version]
path = "chainlit/version.py"
