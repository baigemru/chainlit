name: Unit & integration tests

on: [workflow_call]

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
    name: python ${{ matrix.python-version }}
    env:
      BACKEND_DIR: ./backend
      # The persistence tests are PostgreSQL-only and read this; the service
      # below is what it points at.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/chainlit_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chainlit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/pnpm-node-install
        name: Install Node, pnpm and dependencies.
      - uses: ./.github/actions/uv-python-install
        name: Install Python, uv and Python dependencies
        with:
          python-version: ${{ matrix.python-version }}
          # custom-data carries asyncpg, which TEST_DATABASE_URL needs.
          uv-args: --extra tests --extra custom-data
      - name: Run backend tests
        run: uv run --no-project pytest --cov=chainlit/
      - name: Run frontend tests
        run: pnpm run test
